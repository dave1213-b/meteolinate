name: Aggiorna dati meteo
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: meteo
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: dati
          path: dati
      - name: Leggi i dati ogni minuto per circa 9 minuti
        run: |
          git config --global user.name "meteo-bot"
          git config --global user.email "bot@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8 9; do
            if python scrape.py; then
              cp data.json dati/data.json
              (
                cd dati
                git add data.json
                if ! git diff --staged --quiet; then
                  git commit -qm "dati $(date -u +%H:%M)"
                  git pull --rebase -q || true
                  git push -q || true
                fi
              ) || true
            fi
            sleep 55
          done
      - name: Riavvia da solo il prossimo giro
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run update.yml --ref main

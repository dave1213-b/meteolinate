name: Aggiorna dati meteo
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scrape.py
      - name: Commit
        run: |
          git config user.name "meteo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "dati $(date -u +%H:%M)" && git push)

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meteo Linate Paese</title>
<style>
:root{--bg:#eef3f8;--card:#fff;--tx:#14202e;--mu:#667689;--ac:#1f6feb;--warn:#c2410c;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--card:#16222f;--tx:#e8eef5;--mu:#8fa1b5;--ac:#5aa2ff;--warn:#fb923c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:560px;margin:0 auto}
header{text-align:center;padding:8px 0 16px}
h1{font-size:18px;margin:0;font-weight:600}
.sub{color:var(--mu);font-size:13px}
.hero{background:var(--card);border-radius:20px;padding:20px;text-align:center;margin-bottom:12px}
.big{font-size:72px;font-weight:300;line-height:1}
.mm{color:var(--mu);margin-top:8px}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--mu);margin-top:10px}
.badge.old{color:var(--warn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{background:var(--card);border-radius:16px;padding:14px}
.c h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:0 0 6px;font-weight:600}
.v{font-size:28px;font-weight:500}
.v small{font-size:14px;color:var(--mu);font-weight:400}
.d{font-size:12px;color:var(--mu);margin-top:6px}
.arrow{display:inline-block;transition:transform .3s}
details{margin-top:16px}
summary{cursor:pointer;color:var(--ac);padding:8px 0}
.gr img{width:100%;border-radius:12px;margin:6px 0;background:var(--card)}
footer{text-align:center;color:var(--mu);font-size:12px;margin:24px 0 8px}
footer a{color:var(--ac)}
</style>
</head>
<body>
<header><h1>Linate Paese (MI)</h1><div class="sub">Stazione Davis Vantage Pro2 · 103 m s.l.m.</div></header>
<main id="app"></main>
<footer>Dati: <a href="https://retemeteolombardia.altervista.org/linate/station.htm">Rete Meteo Lombardia</a> · Sito non ufficiale</footer>
<script>
// Dati di esempio, usati solo se data.json non è raggiungibile
var FALLBACK={"temp":{"now":"13.2","max":"13.3","maxT":"15:19","min":"9.6","minT":"6:20"},"hum":{"now":"69","max":"80","min":"68"},"dew":{"now":"7.6"},"press":{"now":"1023.9","max":"1024.6","min":"1021.5"},"rain":{"now":"0.0","event":"0.0","month":"0.0","year":"579.1"},"rate":{"now":"0.0"},"heat":{"now":"12.7"},"wind":{"now":"9.7","dir":"NNE","max":"17.7","maxT":"11:54","avg":"9.7","gustM":"24.1","gustY":"70.8"},"chill":{"now":"12.4"},"time":"15:33","date":"04/11/26","sunrise":"7:08","sunset":"17:07","demo":true};
var B="https://retemeteolombardia.altervista.org/linate/";
var DIRS={N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,S:180,SSO:202.5,SSW:202.5,SO:225,SW:225,OSO:247.5,WSW:247.5,O:270,W:270,ONO:292.5,WNW:292.5,NO:315,NW:315,NNO:337.5,NNW:337.5};
function $(s){return document.createElement(s)}
function v(o,k){return o&&o[k]!=null?o[k]:"–"}
function card(t,val,u,d){return '<div class="c"><h2>'+t+'</h2><div class="v">'+val+' <small>'+u+'</small></div>'+(d?'<div class="d">'+d+'</div>':'')+'</div>'}
function render(D){
  var t=D.temp||{},w=D.wind||{},r=D.rain||{},ang=DIRS[w.dir];
  var badge='Aggiornato alle '+D.time+' del '+D.date,old='';
  if(D.demo){badge='Dati dimostrativi ('+D.time+')';old=' old'}
  else if(D.fetched){var m=(Date.now()-new Date(D.fetched))/60000;if(m>45){old=' old';badge+=' · dati non freschi'}}
  var h='<section class="hero"><div class="big">'+v(t,"now")+'°</div>'
   +'<div class="mm">▲ '+v(t,"max")+'° &nbsp; ▼ '+v(t,"min")+'°</div>'
   +'<div class="mm">Percepita '+v(D.chill,"now")+'°</div>'
   +'<span class="badge'+old+'">'+badge+'</span></section><div class="grid">'
   +card("Umidità",v(D.hum,"now"),"%","Min "+v(D.hum,"min")+"% · Max "+v(D.hum,"max")+"%")
   +card("Pioggia oggi",v(r,"now"),"mm","Mese "+v(r,"month")+" · Anno "+v(r,"year")+" mm")
   +card("Vento",v(w,"now"),"km/h",(ang!=null?'<span class="arrow" style="transform:rotate('+(ang+180)+'deg)">↑</span> ':'')+v(w,"dir")+" · raffica oggi "+v(w,"max")+" km/h")
   +card("Pressione",v(D.press,"now"),"hPa","Min "+v(D.press,"min")+" · Max "+v(D.press,"max"))
   +card("Punto di rugiada",v(D.dew,"now"),"°C","")
   +card("Intensità pioggia",v(D.rate,"now"),"mm/h","")
   +card("Alba",D.sunrise||"–","","")
   +card("Tramonto",D.sunset||"–","","")
   +'</div><details><summary>Grafici ultime 24 ore</summary><div class="gr">'
   +["OutsideTempHistory","OutsideHumidityHistory","RainHistory","BarometerHistory","WindSpeedHistory"].map(function(n){return '<img loading="lazy" src="'+B+n+'.gif" alt="'+n+'" onerror="this.remove()">'}).join("")
   +'</div></details>';
  document.getElementById("app").innerHTML=h;
}
fetch("data.json?"+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(render).catch(function(){render(FALLBACK)});
</script>
</body>
</html>
